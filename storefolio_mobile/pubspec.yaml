name: storefolio
description: "Storefolio Mobile App - متجر إلكتروني للزبائن"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Navigation
  go_router: ^14.6.2
  
  # Networking
  dio: ^5.7.0
  json_annotation: ^4.9.0
  
  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Localization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  
  # Launch URLs (WhatsApp)
  url_launcher: ^6.3.1
  
  # Notifications
  firebase_messaging: ^15.1.6
  firebase_core: ^3.8.1
  firebase_analytics: ^11.3.6

  # Local notifications for foreground FCM
  flutter_local_notifications: ^18.0.1

  # Splash / launcher icon generation
  flutter_native_splash: ^2.4.5
  flutter_launcher_icons: ^0.14.3
  
  # Utils
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  logger: ^2.5.0
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  freezed: ^2.5.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: fonts/Cairo-Regular.ttf
  #       - asset: fonts/Cairo-Bold.ttf
  #         weight: 700
